<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIT-HOOK QR — Literacy Hook & Interactive QR Teaser System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- NAVBAR HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-2">
          <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-sm">
            <i data-lucide="qr-code" class="w-5 h-5"></i>
          </div>
          <span class="font-black text-xl text-indigo-600 tracking-tight">LIT–HOOK QR</span>
        </a>
        <span class="hidden sm:inline-block px-3 py-1 bg-indigo-50 text-indigo-600 text-[11px] font-bold rounded-full">
          Generasi Sadar Literasi
        </span>
      </div>

      <nav class="flex items-center gap-6 text-sm font-semibold text-slate-600">
        <a href="#beranda" class="hover:text-indigo-600 transition flex items-center gap-1.5">
          <i data-lucide="home" class="w-4 h-4"></i> Beranda
        </a>
        <a href="#katalog" class="hover:text-indigo-600 transition flex items-center gap-1.5">
          <i data-lucide="book-open" class="w-4 h-4"></i> Katalog Teaser
        </a>
        <a href="admin.html" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-800 transition flex items-center gap-1.5 shadow-sm">
          <i data-lucide="lock" class="w-3.5 h-3.5"></i> Login Admin
        </a>
      </nav>
    </div>
  </header>

  <!-- HERO SECTION GELAM MODERN -->
  <section id="beranda" class="bg-[#0b0f19] text-white py-16 px-6 relative overflow-hidden border-b border-slate-800">
    <!-- Grid Pattern Background -->
    <div class="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px] opacity-40"></div>

    <div class="max-w-4xl mx-auto text-center relative z-10 space-y-6">
      <div class="inline-block px-4 py-1.5 bg-slate-800/80 border border-slate-700/80 text-indigo-300 text-xs font-bold rounded-full backdrop-blur-sm">
        Perpustakaan Niscala Naladipa SMK Negeri 3 Tuban
      </div>

      <h1 class="text-3xl md:text-5xl font-black tracking-tight leading-tight">
        Penasaran Akhir Ceritanya?<br>
        <span class="bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-300 bg-clip-text text-transparent">
          Temukan Jawabannya di Rak Buku Perpustakaan
        </span>
      </h1>

      <p class="text-slate-400 max-w-2xl mx-auto text-sm md:text-base leading-relaxed">
        Intip potongan komik, trailer sinematik
