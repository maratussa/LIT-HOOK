<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIT-HOOK QR — Katalog Teaser Buku</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- NAVBAR HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="bg-indigo-600 text-white p-2 rounded-xl">
          <i data-lucide="qr-code" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="font-extrabold text-lg text-slate-900 tracking-tight block leading-none">LIT-HOOK QR</span>
          <span class="text-[10px] text-indigo-600 font-semibold tracking-wider uppercase">Library Teaser System</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-slate-600">
        <a href="#katalog" class="hover:text-indigo-600 transition">Beranda</a>
        <a href="admin.html" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-800 transition">Dashboard Admin</a>
      </nav>
    </div>
  </header>

  <!-- KATALOG TEASER BUKU -->
  <main id="katalog" class="max-w-7xl mx-auto px-6 py-10 w-full flex-grow">
    
    <!-- HEADER KATALOG + SEARCH & FILTER -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Katalog Teaser Buku</h1>
        <p class="text-sm text-slate-500 mt-1">Pilih buku fisik yang ingin kamu intip teaser multimedia-nya</p>
      </div>

      <div class="flex items-center gap-3">
        <!-- Input Pencarian -->
        <div class="relative w-full sm:w-64">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Cari judul/penulis..." 
            class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition shadow-sm"
          >
        </div>

        <!-- Filter Kategori -->
        <select 
          id="category-filter" 
          class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition shadow-sm cursor-pointer"
        >
          <option value="">Semua Kategori</option>
          <option value="Fiksi">Fiksi</option>
          <option value="Sains">Sains</option>
          <option value="Biografi">Biografi</option>
          <option value="Sejarah">Sejarah</option>
        </select>
      </div>
    </div>

    <!-- KONTAINER GRID BUKU -->
    <div id="books-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <p class="col-span-full text-center text-slate-400 py-12">Memuat katalog buku...</p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-6 text-center text-xs font-medium text-slate-500">
      &copy; 2026 LIT-HOOK QR — SMK Negeri 3 Tuban. All rights reserved.
    </div>
  </footer>

  <!-- SCRIPT -->
  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
