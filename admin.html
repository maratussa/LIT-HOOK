<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin — LIT-HOOK QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Library QR Code Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- FORM LOGIN ADMIN -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-6">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-200">
      <div class="text-center mb-6">
        <div class="inline-block bg-indigo-600 text-white p-3 rounded-2xl mb-3">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-extrabold text-slate-900">Admin LIT-HOOK QR</h1>
        <p class="text-xs text-slate-500 mt-1">Masuk untuk mengelola buku dan tinjauan review</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Email Admin</label>
          <input type="email" id="email" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
          <input type="password" id="password" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <p id="loginError" class="hidden text-red-500 text-sm text-center font-medium"></p>
        <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-indigo-700 transition">
          Masuk Dashboard
        </button>
      </form>
      <div class="mt-4 text-center">
        <a href="index.html" class="text-xs text-indigo-600 font-semibold hover:underline">← Kembali ke Halaman Utama</a>
      </div>
    </div>
  </div>

  <!-- DASHBOARD UTAMA ADMIN (Disembunyikan sebelum Login) -->
  <div id="adminDashboard" class="hidden min-h-screen flex flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-slate-900 text-white p-6 flex flex-col justify-between">
      <div>
        <div class="flex items-center gap-2 mb-8">
          <i data-lucide="qr-code" class="w-6 h-6 text-indigo-400"></i>
          <span class="font-extrabold text-lg">LIT-HOOK Admin</span>
        </div>
        <nav class="space-y-2 text-sm font-semibold">
          <button id="btn-tab-books" onclick="switchTab('books')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-600 text-white text-left">
            <i data-lucide="book" class="w-4 h-4"></i> Kelola Buku
          </button>
          <button id="btn-tab-reviews" onclick="switchTab('reviews')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-white text-left transition">
            <i data-lucide="message-square" class="w-4 h-4"></i> Moderasi Review
          </button>
        </nav>
      </div>

      <button id="logoutBtn" class="mt-8 flex items-center gap-2 text-rose-400 hover:text-rose-300 text-xs font-bold">
        <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
      </button>
    </aside>

    <!-- Main Content Panel -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
      <!-- TAB KELOLA BUKU -->
      <div id="tab-books">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-slate-900">Kelola Katalog Buku</h2>
          <button onclick="openBookModal()" class="bg-indigo-600 text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 hover:bg-indigo-700 transition">
            <i data-lucide="plus" class="w-4 h-4"></i> Tambah Buku Baru
          </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200 text-xs uppercase">
              <tr>
                <th class="p-4">Buku</th>
                <th class="p-4">Kategori</th>
                <th class="p-4">DDC / Rak</th>
                <th class="p-4">Status</th>
                <th class="p-4 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="admin-books-table" class="divide-y divide-slate-100">
              <!-- Baris buku dimuat dinamis -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- TAB MODERASI REVIEW -->
      <div id="tab-reviews" class="hidden">
        <h2 class="text-2xl font-bold text-slate-900 mb-6">Moderasi Ulasan Siswa</h2>
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200 text-xs uppercase">
              <tr>
                <th class="p-4">Buku</th>
                <th class="p-4">Siswa</th>
                <th class="p-4">Rating & Ulasan</th>
                <th class="p-4">Status</th>
                <th class="p-4 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="admin-reviews-table" class="divide-y divide-slate-100">
              <!-- Baris ulasan dimuat dinamis -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<!-- Modal Tambah / Edit Buku -->
<div id="admin-book-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
    <h3 id="modal-title" class="text-lg font-bold text-slate-800 mb-4">Tambah Buku Baru</h3>
    
    <form id="book-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Judul Buku</label>
        <input type="text" id="form-title" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Penulis</label>
        <input type="text" id="form-author" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Kode DDC</label>
          <input type="text" id="form-ddc" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Lokasi Rak</label>
          <input type="text" id="form-shelf" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Kategori</label>
        <input type="text" id="form-category" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">URL Sampul (Cover)</label>
        <input type="text" id="form-cover" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Deskripsi</label>
        <textarea id="form-desc" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"></textarea>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">URL Bab 1</label>
        <input type="text" id="form-ch1" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">URL Bab 2</label>
        <input type="text" id="form-ch2" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">URL Bab 3</label>
        <input type="text" id="form-ch3" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
      </div>

      <div class="flex justify-end gap-2 pt-4">
        <button type="button" onclick="closeBookModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-semibold">Batal</button>
        <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold">Simpan Buku</button>
      </div>
    </form>
  </div>
</div>
  <!-- MODAL CETAK QR CODE BUKU -->
  <div id="qr-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
    <div class="bg-white rounded-3xl p-6 text-center max-w-sm w-full">
      <h3 class="text-lg font-bold text-slate-900 mb-2">QR Code Teaser</h3>
      <p id="qr-book-title" class="text-xs text-slate-500 mb-4"></p>
      <div id="qrcode" class="flex justify-center mb-4 p-4 bg-slate-50 rounded-2xl border"></div>
      <div class="flex gap-2 justify-center">
        <button onclick="closeQrModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">Tutup</button>
        <button onclick="window.print()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Cetak QR</button>
      </div>
    </div>
  </div>

  <!-- Berkas JS Utama Admin -->
  <script src="admin.js"></script>
  <script>
    // Inisialisasi ikon Lucide
    lucide.createIcons();
  </script>
</body>
</html>
